<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Preço Fácil</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f2f4f7;
    font-family:Arial,sans-serif;
    color:#111827;
}

.app{
    max-width:480px;
    margin:auto;
    padding:14px;
}

.header{
    background:#111827;
    color:white;
    text-align:center;
    padding:24px 15px;
    border-radius:20px 20px 0 0;
}

.header h1{
    margin:0;
    font-size:30px;
}

.header p{
    margin:6px 0 0;
    color:#d1d5db;
    font-size:15px;
}

.card{
    background:white;
    border-radius:0 0 20px 20px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

/* DESCONTO */

.promo{
    background:#ed1111;
    color:white;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    padding:15px;
}

.area{
    padding:22px;
}

label{
    display:block;
    font-weight:bold;
    color:#555;
    margin-bottom:10px;
    font-size:14px;
}

/* CAMPO */

.input{
    height:62px;
    border:3px solid #111827;
    border-radius:14px;
    display:flex;
    align-items:center;
    padding:0 14px;
    background:white;
}

.input b{
    font-size:21px;
    margin-right:8px;
}

input{
    border:0;
    outline:0;
    width:100%;
    font-size:27px;
    font-weight:bold;
    color:#111827;
}

/* REMOVE SETAS DO INPUT NUMBER */

input::-webkit-outer-spin-button,
input::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
}

input[type=number]{
    -moz-appearance:textfield;
}

/* BOTÃO ADICIONAR */

.btnAdicionar{
    width:100%;
    height:55px;
    margin-top:12px;
    background:#111827;
    color:white;
    border:0;
    border-radius:13px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.btnAdicionar:active{
    transform:scale(.98);
}

/* LISTA */

.lista{
    margin-top:22px;
}

.item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#f3f4f6;
    padding:12px 12px;
    border-radius:12px;
    margin-bottom:8px;
}

.item span{
    font-size:19px;
    font-weight:bold;
}

.btnExcluir{
    border:0;
    background:#fee2e2;
    color:#dc2626;
    width:38px;
    height:38px;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

/* DESCONTOS */

.descontos{
    margin-top:25px;
}

.botoesDesconto{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.btnDesconto{
    height:46px;
    border:2px solid #111827;
    background:white;
    color:#111827;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.btnDesconto.ativo{
    background:#ed1111;
    color:white;
    border-color:#ed1111;
}

.outro{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.outro input{
    height:48px;
    border:2px solid #111827;
    border-radius:10px;
    padding:0 12px;
    font-size:18px;
}

.btnAplicar{
    height:48px;
    padding:0 15px;
    border:0;
    border-radius:10px;
    background:#111827;
    color:white;
    font-weight:bold;
}

/* RESULTADO */

.result{
    background:#168ce5;
    color:white;
    text-align:center;
    padding:25px 15px;
    margin-top:5px;
}

.totalOriginal{
    font-size:15px;
    font-weight:bold;
}

.descontoValor{
    margin-top:8px;
    font-size:17px;
}

.precoTitulo{
    margin-top:18px;
    font-size:14px;
    font-weight:bold;
}

.preco{
    font-size:44px;
    font-weight:bold;
    margin-top:4px;
}

.economia{
    margin-top:7px;
    font-size:15px;
    font-weight:bold;
}

/* NOVA VENDA */

.btnNova{
    margin:20px;
    width:calc(100% - 40px);
    height:55px;
    background:#111827;
    color:white;
    border:0;
    border-radius:13px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.vazio{
    text-align:center;
    color:#777;
    padding:10px;
    font-size:14px;
}

/* RESPONSIVO */

@media(max-width:380px){

    .botoesDesconto{
        grid-template-columns:repeat(2,1fr);
    }

    .preco{
        font-size:38px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <h1>Preço Fácil</h1>
        <p>Calculadora de vendas</p>
    </div>

    <div class="card">

        <div class="promo" id="tituloDesconto">
            🔥 DESCONTO
        </div>

        <div class="area">

            <!-- ADICIONAR VALOR -->

            <label>VALOR DO PRODUTO</label>

            <div class="input">
                <b>R$</b>

                <input
                    id="valor"
                    type="number"
                    inputmode="decimal"
                    step="0.01"
                    placeholder="0,00"
                >
            </div>

            <button class="btnAdicionar" onclick="adicionarValor()">
                + ADICIONAR VALOR
            </button>


            <!-- LISTA DE VALORES -->

            <div class="lista" id="lista">

                <div class="vazio" id="vazio">
                    Nenhum produto adicionado
                </div>

            </div>


            <!-- DESCONTOS -->

            <div class="descontos">

                <label>ESCOLHA O DESCONTO</label>

                <div class="botoesDesconto">

                    <button class="btnDesconto" onclick="selecionarDesconto(0,this)">
                        0%
                    </button>

                    <button class="btnDesconto" onclick="selecionarDesconto(5,this)">
                        5%
                    </button>

                    <button class="btnDesconto" onclick="selecionarDesconto(10,this)">
                        10%
                    </button>

                    <button class="btnDesconto" onclick="selecionarDesconto(15,this)">
                        15%
                    </button>

                    <button class="btnDesconto" onclick="selecionarDesconto(20,this)">
                        20%
                    </button>

                    <button class="btnDesconto" onclick="selecionarDesconto(30,this)">
                        30%
                    </button>

                    <button class="btnDesconto" onclick="selecionarDesconto(40,this)">
                        40%
                    </button>

                    <button class="btnDesconto" onclick="selecionarDesconto(50,this)">
                        50%
                    </button>

                    <button class="btnDesconto" onclick="mostrarOutro()">
                        OUTRO
                    </button>

                </div>


                <div class="outro" id="campoOutro" style="display:none">

                    <input
                        id="outroDesconto"
                        type="number"
                        min="0"
                        max="100"
                        placeholder="Ex: 12"
                    >

                    <button class="btnAplicar" onclick="aplicarOutro()">
                        APLICAR
                    </button>

                </div>

            </div>

        </div>


        <!-- RESULTADO -->

        <div class="result">

            <div class="totalOriginal" id="totalOriginal">
                TOTAL: R$ 0,00
            </div>

            <div class="descontoValor" id="descontoValor">
                Desconto: 0% — R$ 0,00
            </div>

            <div class="precoTitulo">
                TOTAL A PAGAR
            </div>

            <div class="preco" id="preco">
                R$ 0,00
            </div>

            <div class="economia" id="economia">
                Você economiza R$ 0,00
            </div>

        </div>


        <button class="btnNova" onclick="novaVenda()">
            🔄 NOVA VENDA
        </button>

    </div>

</div>


<script>

/* ==========================
   VARIÁVEIS
========================== */

let valores = [];

let percentual = 0;


/* ==========================
   FORMATAÇÃO DE DINHEIRO
========================== */

function dinheiro(valor){

    return valor.toLocaleString("pt-BR", {
        style:"currency",
        currency:"BRL"
    });

}


/* ==========================
   ADICIONAR VALOR
========================== */

function adicionarValor(){

    let campo = document.getElementById("valor");

    let valor = Number(campo.value);

    if(!valor || valor <= 0){

        campo.focus();

        return;

    }

    valores.push(valor);

    campo.value = "";

    atualizarLista();

    calcular();

    campo.focus();

}


/* ==========================
   MOSTRAR LISTA
========================== */

function atualizarLista(){

    let lista = document.getElementById("lista");

    lista.innerHTML = "";

    if(valores.length === 0){

        lista.innerHTML =
        '<div class="vazio">Nenhum produto adicionado</div>';

        return;

    }


    valores.forEach(function(valor,index){

        let item = document.createElement("div");

        item.className = "item";

        item.innerHTML = `

            <span>${dinheiro(valor)}</span>

            <button
                class="btnExcluir"
                onclick="excluirValor(${index})">
                🗑️
            </button>

        `;

        lista.appendChild(item);

    });

}


/* ==========================
   EXCLUIR VALOR
========================== */

function excluirValor(index){

    valores.splice(index,1);

    atualizarLista();

    calcular();

}


/* ==========================
   ESCOLHER DESCONTO
========================== */

function selecionarDesconto(valor,botao){

    percentual = valor;


    document.querySelectorAll(".btnDesconto").forEach(function(btn){

        btn.classList.remove("ativo");

    });


    botao.classList.add("ativo");


    document.getElementById("campoOutro").style.display = "none";


    calcular();

}


/* ==========================
   OUTRO DESCONTO
========================== */

function mostrarOutro(){

    document.getElementById("campoOutro").style.display = "flex";

    document.getElementById("outroDesconto").focus();


    document.querySelectorAll(".btnDesconto").forEach(function(btn){

        btn.classList.remove("ativo");

    });

}


/* ==========================
   APLICAR OUTRO %
========================== */

function aplicarOutro(){

    let campo = document.getElementById("outroDesconto");

    let valor = Number(campo.value);


    if(valor < 0 || valor > 100){

        alert("Digite um desconto entre 0% e 100%.");

        return;

    }


    percentual = valor;

    calcular();

}


/* ==========================
   CALCULAR
========================== */

function calcular(){

    let total = valores.reduce(function(soma,valor){

        return soma + valor;

    },0);


    let desconto = total * (percentual / 100);


    let final = total - desconto;


    document.getElementById("totalOriginal").innerText =
        "TOTAL: " + dinheiro(total);


    document.getElementById("descontoValor").innerText =
        "Desconto: " + percentual + "% — " + dinheiro(desconto);


    document.getElementById("preco").innerText =
        dinheiro(final);


    document.getElementById("economia").innerText =
        "Você economiza " + dinheiro(desconto);


    document.getElementById("tituloDesconto").innerText =
        percentual > 0
        ? "🔥 " + percentual + "% DE DESCONTO"
        : "🧮 CALCULADORA DE VENDA";

}


/* ==========================
   NOVA VENDA
========================== */

function novaVenda(){

    valores = [];

    percentual = 0;


    document.getElementById("valor").value = "";

    document.getElementById("outroDesconto").value = "";

    document.getElementById("campoOutro").style.display = "none";


    document.querySelectorAll(".btnDesconto").forEach(function(btn){

        btn.classList.remove("ativo");

    });


    atualizarLista();

    calcular();

    document.getElementById("valor").focus();

}


/* ==========================
   ENTER ADICIONA VALOR
========================== */

document.getElementById("valor").addEventListener("keydown",function(event){

    if(event.key === "Enter"){

        adicionarValor();

    }

});


/* ==========================
   ENTER NO DESCONTO
========================== */

document.getElementById("outroDesconto").addEventListener("keydown",function(event){

    if(event.key === "Enter"){

        aplicarOutro();

    }

});


/* INICIALIZA */

calcular();

</script>

</body>
</html>
