<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calcula Fácil Helpígos</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f2f4f7;
    font-family:Arial,sans-serif;
    color:#111827;
}

.app{
    max-width:460px;
    margin:auto;
    padding:10px;
}

.header{
    background:#111827;
    color:white;
    text-align:center;
    padding:18px 10px;
    border-radius:18px 18px 0 0;
}

.header h1{
    margin:0;
    font-size:25px;
}

.header p{
    margin:4px 0 0;
    color:#d1d5db;
    font-size:13px;
}

.card{
    background:white;
    border-radius:0 0 18px 18px;
    overflow:hidden;
}

.promo{
    background:#ed1111;
    color:white;
    text-align:center;
    font-size:17px;
    font-weight:bold;
    padding:12px;
}

.area{
    padding:16px;
}

label{
    display:block;
    font-weight:bold;
    color:#555;
    margin-bottom:7px;
    font-size:13px;
}

/* VALOR */

.input{
    height:56px;
    border:2px solid #111827;
    border-radius:12px;
    display:flex;
    align-items:center;
    padding:0 12px;
}

.input b{
    font-size:19px;
    margin-right:7px;
}

input{
    border:0;
    outline:0;
    width:100%;
    font-size:25px;
    font-weight:bold;
}

input::-webkit-outer-spin-button,
input::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
}

input[type=number]{
    -moz-appearance:textfield;
}

/* BOTÕES */

.btnCamera,
.btnAdicionar{
    width:100%;
    height:50px;
    margin-top:9px;
    border:0;
    border-radius:11px;
    font-size:16px;
    font-weight:bold;
}

.btnCamera{
    background:#168ce5;
    color:white;
}

.btnAdicionar{
    background:#111827;
    color:white;
}

/* LISTA */

.lista{
    margin-top:14px;
}

.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#f3f4f6;
    padding:8px 10px;
    border-radius:9px;
    margin-bottom:6px;
}

.item span{
    font-size:17px;
    font-weight:bold;
}

.btnExcluir{
    width:34px;
    height:34px;
    border:0;
    border-radius:8px;
    background:#fee2e2;
    color:#dc2626;
    font-size:16px;
}

.vazio{
    text-align:center;
    color:#888;
    font-size:13px;
    padding:6px;
}

/* DESCONTO */

.descontos{
    margin-top:16px;
}

.botoesDesconto{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
}

.btnDesconto{
    height:40px;
    border:1px solid #111827;
    background:white;
    border-radius:8px;
    font-weight:bold;
    font-size:14px;
}

.btnDesconto.ativo{
    background:#ed1111;
    color:white;
    border-color:#ed1111;
}

.outro{
    display:flex;
    gap:6px;
    margin-top:7px;
}

.outro input{
    height:42px;
    border:1px solid #111827;
    border-radius:8px;
    padding:0 8px;
    font-size:17px;
}

.btnAplicar{
    border:0;
    border-radius:8px;
    background:#111827;
    color:white;
    padding:0 12px;
    font-weight:bold;
}

/* RESULTADO */

.result{
    background:#168ce5;
    color:white;
    text-align:center;
    padding:18px 10px;
}

.totalOriginal{
    font-size:14px;
    font-weight:bold;
}

.descontoValor{
    font-size:14px;
    margin-top:5px;
}

.precoTitulo{
    font-size:12px;
    font-weight:bold;
    margin-top:12px;
}

.preco{
    font-size:39px;
    font-weight:bold;
}

.economia{
    font-size:13px;
    margin-top:3px;
}

/* CREDIÁRIO */

.crediario{
    display:block;
    padding:12px 16px;
    background:white;
    border-top:1px solid #e5e7eb;
}

.btnCrediario{
    width:100%;
    height:48px;
    border:0;
    border-radius:10px;
    background:#111827;
    color:white;
    font-size:16px;
    font-weight:bold;
}

.parcelas{
    display:none;
    margin-top:10px;
}

.botoesParcelas{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:5px;
}

.btnParcela{
    height:38px;
    border:1px solid #111827;
    background:white;
    color:#111827;
    border-radius:7px;
    font-size:14px;
    font-weight:bold;
}

.btnParcela.ativo{
    background:#168ce5;
    color:white;
    border-color:#168ce5;
}

.resultadoParcela{
    display:none;
    margin-top:10px;
    background:#f3f4f6;
    padding:10px;
    border-radius:9px;
    text-align:center;
}

.resultadoParcela small{
    color:#666;
    font-size:11px;
}

.valorParcela{
    font-size:25px;
    font-weight:bold;
    margin-top:3px;
}

/* NOVA VENDA */

.btnNova{
    width:calc(100% - 32px);
    margin:12px 16px 16px;
    height:48px;
    border:0;
    border-radius:10px;
    background:#111827;
    color:white;
    font-weight:bold;
    font-size:15px;
}

/* CÂMERA */

.cameraModal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    z-index:9999;
    padding:10px;
    overflow:auto;
}

.cameraBox{
    max-width:460px;
    margin:auto;
    background:white;
    border-radius:16px;
    overflow:hidden;
}

.cameraTitulo{
    background:#111827;
    color:white;
    text-align:center;
    padding:15px;
}

.cameraTitulo h2{
    margin:0;
    font-size:20px;
}

.cameraTitulo p{
    margin:4px 0 0;
    font-size:12px;
}

video{
    width:100%;
    display:block;
    background:#000;
    max-height:55vh;
    object-fit:cover;
}

.cameraArea{
    padding:12px;
}

.btnCapturar,
.btnFechar,
.btnUsar,
.btnTentar{
    width:100%;
    height:46px;
    border:0;
    border-radius:9px;
    font-weight:bold;
    font-size:15px;
}

.btnCapturar{
    background:#168ce5;
    color:white;
}

.btnFechar{
    margin-top:7px;
    background:#e5e7eb;
    color:#111827;
}

.btnUsar{
    background:#16a34a;
    color:white;
}

.btnTentar{
    margin-top:6px;
    background:#111827;
    color:white;
}

.status{
    text-align:center;
    padding:10px 0;
    color:#555;
    font-size:13px;
}

.resultadoLeitura{
    display:none;
    background:#f3f4f6;
    padding:12px;
    border-radius:10px;
    text-align:center;
}

.resultadoLeitura strong{
    font-size:12px;
    color:#555;
}

.precoDetectado{
    font-size:30px;
    font-weight:bold;
    margin:5px;
}

canvas{
    display:none;
}

@media(max-width:360px){

    .botoesDesconto{
        grid-template-columns:repeat(3,1fr);
    }

    .preco{
        font-size:36px;
    }
}
</style>
</head>

<body>

<div class="app">

<div class="header">

    <h1>Calcula Fácil Health</h1>

    <p>Calculadora de vendas</p>

</div>


<div class="card">


<div class="promo" id="tituloDesconto">
    🧮 VENDA
</div>


<div class="area">

<label>VALOR</label>

<div class="input">

    <b>R$</b>

    <input
        id="valor"
        type="number"
        inputmode="decimal"
        step="0.01"
        placeholder="0,00">

</div>


<button class="btnCamera" onclick="abrirCamera()">
    📷 LER ETIQUETA
</button>


<button class="btnAdicionar" onclick="adicionarValor()">
    + ADICIONAR
</button>


<div class="lista" id="lista">

    <div class="vazio">
        Nenhum valor
    </div>

</div>


<div class="descontos">

<label>DESCONTO</label>

<div class="botoesDesconto">

<button class="btnDesconto" onclick="selecionarDesconto(0,this)">0%</button>

<button class="btnDesconto" onclick="selecionarDesconto(5,this)">5%</button>

<button class="btnDesconto" onclick="selecionarDesconto(10,this)">10%</button>

<button class="btnDesconto" onclick="selecionarDesconto(15,this)">15%</button>

<button class="btnDesconto" onclick="selecionarDesconto(20,this)">20%</button>

<button class="btnDesconto" onclick="selecionarDesconto(30,this)">30%</button>

<button class="btnDesconto" onclick="selecionarDesconto(40,this)">40%</button>

<button class="btnDesconto" onclick="selecionarDesconto(50,this)">50%</button>

<button class="btnDesconto" onclick="mostrarOutro()">OUTRO</button>

</div>


<div class="outro" id="campoOutro" style="display:none">

<input
    id="outroDesconto"
    type="number"
    min="0"
    max="100"
    placeholder="%">

<button class="btnAplicar" onclick="aplicarOutro()">
    OK
</button>

</div>

</div>

</div>


<!-- RESULTADO -->

<div class="result">

<div class="totalOriginal" id="totalOriginal">
TOTAL: R$ 0,00
</div>

<div class="descontoValor" id="descontoValor">
0% — R$ 0,00
</div>

<div class="precoTitulo">
TOTAL A PAGAR
</div>

<div class="preco" id="preco">
R$ 0,00
</div>

<div class="economia" id="economia">
Economia R$ 0,00
</div>

</div>


<!-- CREDIÁRIO VISÍVEL -->

<div class="crediario">

<button class="btnCrediario" onclick="abrirCrediario()">
    💳 CREDIÁRIO
</button>


<div class="parcelas" id="parcelas">

<div class="botoesParcelas">

<button class="btnParcela" onclick="calcularParcela(1,this)">
1x
</button>

<button class="btnParcela" onclick="calcularParcela(2,this)">
2x
</button>

<button class="btnParcela" onclick="calcularParcela(3,this)">
3x
</button>

<button class="btnParcela" onclick="calcularParcela(4,this)">
4x
</button>

<button class="btnParcela" onclick="calcularParcela(5,this)">
5x
</button>

<button class="btnParcela" onclick="calcularParcela(6,this)">
6x
</button>

<button class="btnParcela" onclick="calcularParcela(7,this)">
7x
</button>

<button class="btnParcela" onclick="calcularParcela(8,this)">
8x
</button>

<button class="btnParcela" onclick="calcularParcela(9,this)">
9x
</button>

<button class="btnParcela" onclick="calcularParcela(10,this)">
10x
</button>

</div>


<div class="resultadoParcela" id="resultadoParcela">

<small>
PARCELAMENTO
</small>

<div class="valorParcela" id="valorParcela">
10x de R$ 0,00
</div>

</div>

</div>

</div>


<button class="btnNova" onclick="novaVenda()">
    🔄 NOVA VENDA
</button>


</div>

</div>


<!-- MODAL DA CÂMERA -->

<div class="cameraModal" id="cameraModal">

<div class="cameraBox">

<div class="cameraTitulo">

<h2>
📷 Ler etiqueta
</h2>

<p>
Aponte para o preço
</p>

</div>


<video id="video" autoplay playsinline></video>

<canvas id="canvas"></canvas>


<div class="cameraArea">

<button class="btnCapturar" onclick="capturarEtiqueta()">
📸 CAPTURAR
</button>


<div class="status" id="status">
Posicione o preço no centro.
</div>


<div class="resultadoLeitura" id="resultadoLeitura">

<strong>
PREÇO ENCONTRADO
</strong>


<div class="precoDetectado" id="precoDetectado">
R$ 0,00
</div>


<button class="btnUsar" onclick="usarPrecoDetectado()">
✓ ADICIONAR
</button>


<button class="btnTentar" onclick="tentarNovamente()">
TENTAR NOVAMENTE
</button>

</div>


<button class="btnFechar" onclick="fecharCamera()">
FECHAR
</button>

</div>

</div>

</div>


<script>

/* =========================
   VARIÁVEIS
========================= */

let valores = [];

let percentual = 0;

let streamCamera = null;

let precoLido = 0;


/* =========================
   DINHEIRO
========================= */

function dinheiro(valor){

return valor.toLocaleString("pt-BR",{

style:"currency",

currency:"BRL"

});

}


/* =========================
   ADICIONAR
========================= */

function adicionarValor(){

let campo = document.getElementById("valor");

let valor = Number(
String(campo.value).replace(",",".")
);

if(!valor || valor <= 0){

campo.focus();

return;

}

valores.push(valor);

campo.value = "";

atualizarLista();

calcular();

campo.focus();

}


/* =========================
   LISTA
========================= */

function atualizarLista(){

let lista = document.getElementById("lista");

lista.innerHTML = "";

if(valores.length === 0){

lista.innerHTML =
'<div class="vazio">Nenhum valor</div>';

return;

}


valores.forEach(function(valor,index){

let item = document.createElement("div");

item.className = "item";

item.innerHTML = `

<span>
${dinheiro(valor)}
</span>

<button
class="btnExcluir"
onclick="excluirValor(${index})">
🗑️
</button>

`;

lista.appendChild(item);

});

}


/* =========================
   EXCLUIR
========================= */

function excluirValor(index){

valores.splice(index,1);

atualizarLista();

calcular();

}


/* =========================
   DESCONTO
========================= */

function selecionarDesconto(valor,botao){

percentual = valor;

document.querySelectorAll(".btnDesconto")
.forEach(function(btn){

btn.classList.remove("ativo");

});

botao.classList.add("ativo");

document.getElementById("campoOutro")
.style.display = "none";

calcular();

}


function mostrarOutro(){

document.getElementById("campoOutro")
.style.display = "flex";

document.getElementById("outroDesconto")
.focus();

document.querySelectorAll(".btnDesconto")
.forEach(function(btn){

btn.classList.remove("ativo");

});

}


function aplicarOutro(){

let valor = Number(
document.getElementById("outroDesconto").value
);

if(valor < 0 || valor > 100){

alert(
"Digite um desconto entre 0% e 100%."
);

return;

}

percentual = valor;

calcular();

}


/* =========================
   CALCULAR
========================= */

function calcular(){

let total = valores.reduce(
function(soma,valor){

return soma + valor;

},0);


let desconto =
total * (percentual / 100);


let final =
total - desconto;


document.getElementById("totalOriginal")
.innerText =
"TOTAL: " + dinheiro(total);


document.getElementById("descontoValor")
.innerText =
percentual + "% — " +
dinheiro(desconto);


document.getElementById("preco")
.innerText =
dinheiro(final);


document.getElementById("economia")
.innerText =
"Economia " + dinheiro(desconto);


document.getElementById("tituloDesconto")
.innerText =
percentual > 0
? "🔥 " + percentual + "% DE DESCONTO"
: "🧮 VENDA";

}


/* =========================
   CREDIÁRIO
========================= */

function abrirCrediario(){

let parcelas =
document.getElementById("parcelas");


if(parcelas.style.display === "block"){

parcelas.style.display = "none";

}else{

parcelas.style.display = "block";

}

}


/* =========================
   CALCULAR PARCELA
========================= */

function calcularParcela(numero,botao){

let total = valores.reduce(
function(soma,valor){

return soma + valor;

},0);


let desconto =
total * (percentual / 100);


let final =
total - desconto;


if(final <= 0){

alert(
"Adicione pelo menos um produto."
);

return;

}


document.querySelectorAll(".btnParcela")
.forEach(function(btn){

btn.classList.remove("ativo");

});


botao.classList.add("ativo");


let parcela =
final / numero;


document.getElementById("valorParcela")
.innerText =
numero + "x de " +
dinheiro(parcela);


document.getElementById("resultadoParcela")
.style.display = "block";

}


/* =========================
   NOVA VENDA
========================= */

function novaVenda(){

valores = [];

percentual = 0;

precoLido = 0;


document.getElementById("valor").value = "";

document.getElementById("outroDesconto").value = "";


document.getElementById("campoOutro")
.style.display = "none";


document.getElementById("parcelas")
.style.display = "none";


document.getElementById("resultadoParcela")
.style.display = "none";


document.querySelectorAll(".btnDesconto")
.forEach(function(btn){

btn.classList.remove("ativo");

});


document.querySelectorAll(".btnParcela")
.forEach(function(btn){

btn.classList.remove("ativo");

});


atualizarLista();

calcular();

document.getElementById("valor").focus();

}


/* =========================
   CÂMERA
========================= */

async function abrirCamera(){

let modal =
document.getElementById("cameraModal");

let video =
document.getElementById("video");

let status =
document.getElementById("status");


document.getElementById("resultadoLeitura")
.style.display = "none";


modal.style.display = "block";


try{

streamCamera =
await navigator.mediaDevices.getUserMedia({

video:{
facingMode:{
ideal:"environment"
}
},

audio:false

});


video.srcObject =
streamCamera;


}catch(error){

status.innerText =
"Não foi possível abrir a câmera.";

alert(
"Permita o acesso à câmera."
);

}

}


/* =========================
   CAPTURAR ETIQUETA
========================= */

async function capturarEtiqueta(){

let video =
document.getElementById("video");

let canvas =
document.getElementById("canvas");

let status =
document.getElementById("status");


if(!video.videoWidth){

status.innerText =
"A câmera ainda não está pronta.";

return;

}


status.innerText =
"🔎 Lendo preço...";


canvas.width =
video.videoWidth;

canvas.height =
video.videoHeight;


let contexto =
canvas.getContext("2d");


contexto.drawImage(

video,

0,

0,

canvas.width,

canvas.height

);


try{

const {data} =
await Tesseract.recognize(

canvas,

"por",

{

logger:function(info){

if(
info.status ===
"recognizing text"
){

status.innerText =
"🔎 Lendo... " +
Math.round(
info.progress * 100
) +
"%";

}

}

}

);


let preco =
encontrarPreco(data.text);


if(preco){

precoLido = preco;


document.getElementById(
"precoDetectado"
).innerText =
dinheiro(preco);


document.getElementById(
"resultadoLeitura"
).style.display =
"block";


status.innerText =
"Preço encontrado.";

}else{

status.innerText =
"Não encontrei o preço. Tente novamente.";

}


}catch(error){

console.error(error);

status.innerText =
"Erro ao ler. Tente novamente.";

}

}


/* =========================
   ENCONTRAR PREÇO
========================= */

function encontrarPreco(texto){

let encontrados = [];


let padrao =
/R?\s*\$?\s*(\d{1,3}(?:[.\s]\d{3})*(?:,\d{2})|\d+(?:,\d{2}))/gi;


let resultado;


while(
(resultado = padrao.exec(texto))
!== null
){

let numero =
resultado[1]
.replace(/\s/g,"")
.replace(/\./g,"")
.replace(",", ".");


let valor =
Number(numero);


if(
valor > 0 &&
valor < 100000
){

encontrados.push(valor);

}

}


if(encontrados.length === 0){

let lista =
texto.match(
/\b\d{1,5}[,.]\d{2}\b/g
);


if(lista){

lista.forEach(function(item){

let valor =
Number(
item.replace(",",".")
);


if(
valor > 0 &&
valor < 100000
){

encontrados.push(valor);

}

});

}

}


return encontrados.length
? encontrados[0]
: null;

}


/* =========================
   USAR PREÇO
========================= */

function usarPrecoDetectado(){

if(!precoLido){

return;

}


valores.push(precoLido);

atualizarLista();

calcular();


precoLido = 0;


document.getElementById(
"resultadoLeitura"
).style.display =
"none";


document.getElementById(
"status"
).innerText =
"✅ Adicionado. Pode ler outra etiqueta.";

}


/* =========================
   TENTAR NOVAMENTE
========================= */

function tentarNovamente(){

document.getElementById(
"resultadoLeitura"
).style.display =
"none";


document.getElementById(
"status"
).innerText =
"Posicione o preço no centro.";

}


/* =========================
   FECHAR CÂMERA
========================= */

function fecharCamera(){

if(streamCamera){

streamCamera
.getTracks()
.forEach(function(track){

track.stop();

});

streamCamera = null;

}


document.getElementById(
"video"
).srcObject = null;


document.getElementById(
"cameraModal"
).style.display =
"none";

}


/* =========================
   ENTER
========================= */

document.getElementById("valor")
.addEventListener(
"keydown",
function(event){

if(event.key === "Enter"){

adicionarValor();

}

});


document.getElementById("outroDesconto")
.addEventListener(
"keydown",
function(event){

if(event.key === "Enter"){

aplicarOutro();

}

});


/* INICIALIZA */

calcular();

</script>

</body>
</html>
